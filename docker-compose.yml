services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: oto-macenauer-portfolio:latest
    container_name: portfolio-website
    ports:
      # External port stays 3000 so nothing upstream needs reconfiguring.
      # nginx-unprivileged listens on 8080 inside the container.
      - "3000:8080"
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: nginx binds IPv4 only, and busybox wget
      # resolves localhost to ::1 first, which fails with "connection refused".
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
