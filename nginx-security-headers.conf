# Shared security headers.
#
# Included from both the server block and every location block that uses
# add_header, because add_header in a location REPLACES inherited headers
# instead of extending them. Lives in /etc/nginx/snippets/ (not conf.d/)
# so nginx does not auto-load it as a top-level config file.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# "0" disables the legacy browser XSS auditor, which is deprecated and has
# itself been an attack vector (filter-based information leaks). Modern
# protection comes from the CSP below.
add_header X-XSS-Protection "0" always;

# frame-ancestors in the CSP is the modern replacement for X-Frame-Options;
# the old header is kept for legacy user agents.
add_header X-Frame-Options "DENY" always;

# The site ships no external assets: fonts are self-hosted, images are built
# by astro:assets, and the only scripts/styles are the ones Astro inlines
# into the HTML — hence 'unsafe-inline' (hashes would change every build).
# There is no user-generated content, so the residual inline risk is low.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# No browser feature is used by the site; deny the sensitive ones outright.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# The site opens no cross-origin popups; isolate the browsing context group.
add_header Cross-Origin-Opener-Policy "same-origin" always;
