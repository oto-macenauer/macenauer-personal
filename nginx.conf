# Don't advertise the nginx version in Server headers and error pages.
server_tokens off;

server {
    # nginx-unprivileged runs as a non-root user, so it cannot bind port 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers live in one snippet because add_header in a location
    # block REPLACES the server-level headers rather than adding to them —
    # every location that sets its own headers must re-include it.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Astro emits content-hashed filenames under /_astro/, so they can be
    # cached forever. A new build produces new names.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The build never emits dotfiles; block them anyway so a future build or
    # deploy mistake (.env, .git, editor droppings) can't be served.
    # 404 rather than 403 to avoid confirming anything exists.
    # .well-known stays reachable for ACME / security.txt style uses.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Static site: resolve the file, then the directory index, then 404.
    # Deliberately NOT falling back to /index.html — an SPA-style fallback
    # would answer typo'd URLs with 200 and the homepage, which is bad for SEO.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
