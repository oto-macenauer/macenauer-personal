server {
    # nginx-unprivileged runs as a non-root user, so it cannot bind port 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers — these were previously set in next.config.ts.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Astro emits content-hashed filenames under /_astro/, so they can be
    # cached forever. A new build produces new names.
    #
    # NOTE: add_header in a location block REPLACES the server-level headers
    # rather than adding to them, so the security headers are repeated here.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Static site: resolve the file, then the directory index, then 404.
    # Deliberately NOT falling back to /index.html — an SPA-style fallback
    # would answer typo'd URLs with 200 and the homepage, which is bad for SEO.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
