version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Astro core and its integrations must move together — a version skew
      # between astro and @astrojs/* breaks the build.
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      types:
        patterns:
          - "@types/*"
    ignore:
      # TypeScript 7 (the native port) is not supported by Astro yet:
      # @astrojs/check declares "typescript": "^5.0.0 || ^6.0.0", so 7.0.x
      # breaks `npm run build`. Support is expected in 7.1, which this range
      # deliberately leaves un-ignored.
      - dependency-name: "typescript"
        versions: [">=7.0.0 <7.1.0"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
